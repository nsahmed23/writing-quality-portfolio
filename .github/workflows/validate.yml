name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/validate_portfolio.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m evaluation.benchmark_v2.automated demo --out .eval-runs/ci-demo
      - run: python -m unittest discover -s evaluation/pilot/tests -t evaluation/pilot -p 'test_*.py'
        env:
          PYTHONPATH: evaluation/pilot/src
          # Windows runners default TEMP to an 8.3 short path (RUNNER~1), which the pilot's input-alias check rejects.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: python scripts/verify_manifests.py
